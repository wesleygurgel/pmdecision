[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pm-decision"
version = "0.1.0"
description = "Personal PM Decision timesheet automation"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.47.0",
    "openai>=1.50.0",
    "holidays>=0.57",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
pm-decision = "pm_decision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
